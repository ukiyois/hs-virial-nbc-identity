        role: "research-direction contributor; proposed the graph-theoretic/NBC route, not the exact final identity"
    type: "other"
    location: "Internal Danus hs-virial fact graph (not shipped in this repository)"
    relationship: "adapts"
    note: >-
      The Lean development re-proves the used statements and does not import
      fact records as proof terms.  The recorded worker identifiers are
      provenance credits, not authorship of this Lean proof.
    author_endorsement: "n/a"
  - title: "Single-element extensions of matroids"
    authors:
      - "Henry H. Crapo"
    type: "paper"
    location: "Canadian Journal of Mathematics 19 (1967), 1265-1275"
    relationship: "background"
    note: >-
      Background for the classical no-broken-circuit/Tutte-polynomial
      interpretation; no theorem from the article is imported as a proof term.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    For natural numbers k and d with 2 <= k, the project proves
    (k.factorial : Real) * |hardSphereBk| equal to the finite sum of the
    transported NBC-region volumes over all spanning trees of the complete
    graph.  The primary configuration measure is the product of Euclidean
    Lebesgue measures on Fin (k - 1) -> EuclideanSpace Real (Fin d); an
    explicit measurable, measure-preserving coordinate equivalence to
    EuclideanSpace Real (Fin ((k - 1) * d)) is also proved.  The project does
    not claim strict positivity of b_k, a separate complete sign-alternation
    theorem, convergence bounds, or freezing-singularity consequences.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarHS.main_result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

