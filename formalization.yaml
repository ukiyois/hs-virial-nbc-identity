fidelity:
  divergences: >-
    The formal statement uses natural d, so it also covers the degenerate d=0
    case although the exposition emphasizes d>=1.  Its primary domain is the
    canonical product measure on Fin (k-1) -> EuclideanSpace Real (Fin d); the
    flat Euclidean presentation is connected by an explicit measure-preserving
    equivalence rather than by definitional equality.  The flat NBC region is
    the image under that equivalence.  The theorem uses the lexicographically
    largest-edge broken-circuit convention and does not include strict
    positivity or convergence corollaries.

