version: "v0.4"

project:
  name: "Hard-sphere Mayer NBC volume identity"
  description: >-
    A Lean formalization of the exact no-broken-circuit volume identity for
    hard-sphere Mayer cluster integrals.  The development proves the finite
    graph cancellation, the measurable finite region decomposition, the
    anchored Euclidean product-measure theorem, and its explicit flat-coordinate
    measure-preserving transport.  The central contribution is the exact
    pointwise-to-integral bridge for a configuration-dependent overlap graph;
    the classical finite cancellation and the conventional coordinate change
    are recorded as ingredients, not as standalone novelty claims.
  authors:
    - "ukiyois"
    - "OpenCode agent sessions"
  responsible_maintainers:
    - "ukiyois"
  license: "Apache-2.0"

