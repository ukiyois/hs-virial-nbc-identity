status:
  scope: >-
    For natural numbers k and d with 2 <= k, the project proves the exact
    identity (k.factorial : Real) * |hardSphereBk| as the finite sum of
    transported NBC-region volumes over all spanning trees of the complete
    graph.  In dimension three it additionally proves, for every tree T, the
    stronger per-tree bound
    Vol(NBC_T) <= (17/32)^hardSphereNu T * hardSphereKappa^(k-1).
    Here hardSphereNu T is the maximum cardinality of a packing of pairwise
    vertex-disjoint, order-compatible forks.  A formal fork has ordered labels
    a < b < c, center a, leaves b,c, and tree edges {a,b} and {a,c}.  The proof
    is an attachment-aware, orientation-aware measure-preserving factorization:
    each packed
    order-compatible fork
    contributes a separated pair of relative coordinates and every remaining
    coordinate contributes a unit-ball factor.  The primary configuration
    measure is the product of Euclidean Lebesgue measures on
    Fin (k - 1) -> EuclideanSpace Real (Fin d), with an explicit
    measure-preserving transport to EuclideanSpace Real (Fin ((k - 1) * d)).
    Strict positivity of b_k, a separate complete sign-alternation theorem,
    convergence bounds, and freezing-singularity consequences are separate
    targets.  The finite NBC cancellation, coordinate transport, and fork
    factorization form a checked bridge from the configuration-dependent
    overlap graph to quantitative measurable NBC-region volumes.
  sorry_count: 2
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarHS.nbc_region_real_volume_le_fork_factor"
