version: "v0.4"

project:
  name: "Hard-sphere Mayer NBC volume identity"
  description: >-
    A Lean formalization of the exact no-broken-circuit volume identity for
    hard-sphere Mayer cluster integrals.  The development proves the finite
    graph cancellation, the measurable finite region decomposition, the
    anchored Euclidean product-measure theorem, and its explicit flat-coordinate
    measure-preserving transport.
  authors:
    - "ukiyois"
    - "OpenCode agent sessions"
  responsible_maintainers:
    - "ukiyois"
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO", "math-ph"]
  msc2020: ["05C15", "82B05"]

sources:
  - title: "Danus hs-virial verified fact chain: hard-sphere NBC identities"
    contributors:
      - name: "xhigh3"
        role: "recorded author of fact 2041d4f28d05949e"
      - name: "xhigh5"
        role: "recorded author of facts 4afee99f8b8e6010 and 7dcc52cfec5875b2"
      - name: "high3"
        role: "recorded author of fact 6d35ccd3e0232041"
