name = "hs-virial-math-assets"
version = "0.1.0"
defaultTargets = ["NBCVolume", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "NBCVolume"
srcDir = "lean"
roots = ["NBCVolume", "NBCMatroid", "NBCGraph", "GraphicMatroid", "MayerNBC", "HardSphereNBC", "HardSphereMeasure", "HardSphereFork", "HardSphereTree", "HardSphereGeometry", "HardSphereTreeDifference", "HardSphereTreeEdges", "HardSphereCompound", "HardSphereClosePair", "HardSphereForkPackingCoordinates"]

[[lean_lib]]
name = "Challenge"
srcDir = "."
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
srcDir = "."
roots = ["Solution"]
